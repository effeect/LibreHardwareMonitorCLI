name: Build LibreMonitor Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get Latest LibreHardwareMonitor DLLs
        id: get_release
        run: |
          $response = Invoke-RestMethod -Uri "https://api.github.com/repos/LibreHardwareMonitor/LibreHardwareMonitor/releases/latest"
          $asset = $response.assets | Where-Object { $_.name -eq "LibreHardwareMonitor.zip" }
          "zip_url=$($asset.browser_download_url)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "lhm_version=$($response.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download and Extract DLLs
        run: |
          curl -L -o LibreHardwareMonitor.zip $env:zip_url
          Expand-Archive -Path LibreHardwareMonitor.zip -DestinationPath libre_cli -Force

      - name: Build with PyInstaller
        run: python -m PyInstaller LibreMonitor.spec

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreMonitor-${{ github.sha }}
          path: dist/LibreMonitor.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "Built with LibreHardwareMonitor $env:lhm_version`n`nDownload LibreMonitor.exe below and run as Administrator for full sensor visibility."
          gh release create $tag dist/LibreMonitor.exe `
            --title "LibreMonitor $tag" `
            --notes $notes `
            --verify-tag
